<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>籌備委員｜台灣姐妹大會籌備委員會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --accent:#2B4C7E; --accent-hover:#1C3459; --tint:#E6ECF5;
  --text:#1F2933; --text-2:#52606D; --text-3:#616E7C;
  --line:#E4E7EB; --line-strong:#CBD2D9; --bg:#FFFFFF; --bg-soft:#F5F7FA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif}
a{color:var(--accent)} a:hover{color:var(--accent-hover)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* 頁首 */
.site-header{border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;padding-block:18px}
.brand{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--text)}
.brand-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.brand-sub{font-size:12px;color:var(--text-3)}
.main-nav{display:flex;flex-wrap:wrap;gap:4px}
.main-nav a{padding:10px 12px;font-size:15px;color:#3E4C59;text-decoration:none;border-radius:6px}
.main-nav a:hover{background:var(--bg-soft)}
.main-nav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:500}

/* 標題區 */
main{padding-block:56px 72px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px}
h1{margin:0 0 10px;font-family:'Noto Serif TC',serif;font-size:40px;letter-spacing:.06em}
.lead{margin:0;font-size:16px;color:var(--text-2);line-height:1.7}
.search{display:flex;flex-direction:column;gap:6px;width:300px;max-width:100%}
.search label{font-size:13px;color:var(--text-2)}
.search input{height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:8px;font:inherit;font-size:15px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}

/* 地區快捷鈕 */
.region-nav{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:40px}
.region-nav a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--line-strong);border-radius:999px;font-size:15px;color:var(--text);text-decoration:none}
.region-nav a:hover{border-color:var(--accent)}
.region-nav span{font-size:13px;color:var(--text-3)}

/* 委員卡片 */
.region{display:flex;flex-direction:column;gap:20px;margin-bottom:56px;scroll-margin-top:24px}
.region-head{display:flex;align-items:baseline;gap:12px}
.region-head h2{margin:0;font-size:22px}
.region-head span{font-size:14px;color:var(--text-3)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-size:24px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{display:block;font-size:18px;font-weight:700;letter-spacing:.04em}
.stake{display:block;margin-top:4px;font-size:14px;color:var(--text-2)}
.empty{color:var(--text-2)}

/* 頁尾 */
.site-footer{border-top:1px solid var(--line);background:var(--bg-soft)}
.site-footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:28px;font-size:14px;color:var(--text-2)}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#top">
      <span class="brand-title">台灣姐妹大會籌備委員會</span>
      <span class="brand-sub">耶穌基督後期聖徒教會</span>
    </a>
    <nav class="main-nav" aria-label="主選單">
      <a href="#">大會簡介</a>
      <a href="#">主席的話</a>
      <a href="#">會議記錄</a>
      <a href="#">工作團隊</a>
      <a href="#" aria-current="page">籌備委員</a>
      <a href="#">執行計畫</a>
      <a href="#">大會網站</a>
    </nav>
  </div>
</header>

<main id="top" class="wrap">
  <div class="page-head">
    <div>
      <h1>籌備委員</h1>
      <p class="lead">來自全台 21 個支聯會、共 31 位姊妹，依北、中、南區排列。</p>
    </div>
    <div class="search">
      <label for="q">搜尋姓名或支聯會</label>
      <input id="q" type="search" placeholder="例如：台南、陳">
    </div>
  </div>
  <nav class="region-nav" id="region-nav" aria-label="地區"></nav>
  <div id="regions"></div>
  <p class="empty" id="empty" hidden>找不到符合的委員。</p>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>台灣姐妹大會籌備委員會</span>
    <a href="#top">回到頂端</a>
  </div>
</footer>

<script>
// 資料：photo 欄位填入正方形大頭照網址即可取代姓氏頭像
const REGIONS = [
  { id: 'north', name: '北區', members: [
    { name: '張靜芳', stake: '東台北支聯會', photo: '' },
    { name: '朱麗蓁', stake: '東台北支聯會', photo: '' },
    { name: '黃宜珍', stake: '西台北支聯會', photo: '' },
    { name: '巫佳珍', stake: '西台北支聯會', photo: '' },
    { name: '王怡淑', stake: '南台北支聯會', photo: '' },
    { name: '游蕙臻', stake: '南台北支聯會', photo: '' },
    { name: '楊曉涵', stake: '北台北支聯會', photo: '' },
    { name: '姚倩韻', stake: '北台北支聯會', photo: '' },
    { name: '許惠玲', stake: '中台北支聯會', photo: '' },
    { name: '鄒玉英', stake: '中台北支聯會', photo: '' },
    { name: '廖邱淑如', stake: '桃園支聯會', photo: '' },
    { name: '鄭雯雯', stake: '龜山支聯會', photo: '' },
    { name: '蕭美鳳', stake: '新竹支聯會', photo: '' },
    { name: '余紀瑤', stake: '新竹支聯會', photo: '' },
    { name: '蘇筱雯', stake: '花蓮支聯會', photo: '' }
  ]},
  { id: 'central', name: '中區', members: [
    { name: '彭潔心', stake: '東台中支聯會', photo: '' },
    { name: '石蔡君佩', stake: '東台中支聯會', photo: '' },
    { name: '吳秀如', stake: '西台中支聯會', photo: '' },
    { name: '劉毓幸', stake: '西台中支聯會', photo: '' },
    { name: '李蕙儒', stake: '南台中支聯會', photo: '' },
    { name: '陳思蓉', stake: '南台中支聯會', photo: '' },
    { name: '陳月杏', stake: '中興支聯會', photo: '' },
    { name: '陳淑惠', stake: '中興支聯會', photo: '' }
  ]},
  { id: 'south', name: '南區', members: [
    { name: '葉玉嫺', stake: '嘉義支聯會', photo: '' },
    { name: '李文琦', stake: '嘉義支聯會', photo: '' },
    { name: '楊若男', stake: '台南支聯會', photo: '' },
    { name: '羅惠真', stake: '台南支聯會', photo: '' },
    { name: '陳莉櫻', stake: '北高雄支聯會', photo: '' },
    { name: '陳春秀', stake: '北高雄支聯會', photo: '' },
    { name: '張蜀慧', stake: '南高雄支聯會', photo: '' },
    { name: '黃秋燕', stake: '南高雄支聯會', photo: '' }
  ]}
];

const regionsEl = document.getElementById('regions');
const navEl = document.getElementById('region-nav');
const emptyEl = document.getElementById('empty');

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function render(query) {
  const q = (query || '').trim();
  regionsEl.replaceChildren();
  navEl.replaceChildren();
  let total = 0;
  REGIONS.forEach((r) => {
    const list = r.members.filter((m) => !q || m.name.includes(q) || m.stake.includes(q));
    if (!list.length) return;
    total += list.length;

    const chip = el('a', null, r.name);
    chip.href = '#' + r.id;
    chip.append(el('span', null, String(list.length)));
    navEl.append(chip);

    const sec = el('section', 'region');
    sec.id = r.id;
    const head = el('div', 'region-head');
    head.append(el('h2', null, r.name), el('span', null, list.length + ' 位'));
    const ul = el('ul', 'grid');
    list.forEach((m) => {
      const li = el('li', 'card');
      const av = el('div', 'avatar');
      if (m.photo) {
        const img = document.createElement('img');
        img.src = m.photo; img.alt = m.name;
        av.append(img);
      } else {
        av.textContent = m.name.charAt(0);
        av.setAttribute('aria-hidden', 'true');
      }
      const info = el('div');
      info.append(el('span', 'name', m.name), el('span', 'stake', m.stake));
      li.append(av, info);
      ul.append(li);
    });
    sec.append(head, ul);
    regionsEl.append(sec);
  });
  emptyEl.hidden = total > 0;
}

document.getElementById('q').addEventListener('input', (e) => render(e.target.value));
render('');
</script>
</body>
</html>
