<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --accent:#2B4C7E; --accent-hover:#1C3459; --tint:#E6ECF5;
  --text:#1F2933; --text-body:#323F4B; --text-2:#52606D; --text-3:#616E7C;
  --line:#E4E7EB; --line-strong:#CBD2D9; --bg:#FFFFFF; --bg-soft:#F5F7FA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif}
a{color:var(--accent)} a:hover{color:var(--accent-hover)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* 頁首 */
.site-header{border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;padding-block:18px}
.brand{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--text)}
.brand-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;letter-spacing:.04em}
.brand-sub{font-size:12px;color:var(--text-3)}
.main-nav{display:flex;flex-wrap:wrap;gap:4px}
.main-nav a{padding:10px 12px;font-size:15px;color:#3E4C59;text-decoration:none;border-radius:6px}
.main-nav a:hover{background:var(--bg-soft)}
.main-nav a[aria-current="page"]{background:var(--accent);color:#fff;font-weight:500}

/* 頁尾 */
.site-footer{border-top:1px solid var(--line);background:var(--bg-soft)}
.site-footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:28px;font-size:14px;color:var(--text-2)}

/* ===== 個人頁 ===== */
.member-main{padding-block:32px 72px}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:#3E4C59;text-decoration:none}
.member{margin-top:16px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:40px 64px}
.member-photo{flex:0 1 420px;max-width:100%;background:var(--tint);border-radius:20px;padding:20px}
.member-photo img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:12px;display:block}
.member-photo .placeholder{width:100%;aspect-ratio:3/4;border-radius:12px;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-size:96px;font-weight:700}
.member-text{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:28px;padding-top:24px}
.member-stake{font-size:15px;color:var(--accent);font-weight:500;letter-spacing:.04em}
.member-text h1{margin:10px 0 0;font-family:'Noto Serif TC',serif;font-size:52px;letter-spacing:.08em;line-height:1.2}
.rule{width:48px;height:3px;background:var(--accent);border-radius:2px;margin-top:18px}
.bio{margin:0;font-size:18px;line-height:2.1;color:var(--text-body);max-width:34em;white-space:pre-line}
.bio.pending{color:var(--text-3)}
</style>
</head>

        <h1>蘇筱雯</h1>
        <div class="rule" aria-hidden="true"></div>
      </div>
      <p class="bio">我是花蓮支聯會花蓮二支會的蘇筱雯姊妹，加入教會24年，在教會曾擔任慈助會會長、慈助會諮理、初級會會長、初級會諮理、女青年諮理、主日學教師、支會婚姻與家庭關係課程教師，很喜歡在教會的每一個事工召喚，讓我在屬世屬靈上不斷的成長，也在其中感受到神的愛，也蒙受許多恩典及祝福，很期待在姊妹大會的服事。</p>
